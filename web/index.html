<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MyWorld</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%97%86%3C/text%3E%3C/svg%3E" />
  <script>
    /* 在样式生效前定好主题，避免首屏闪一下白/黑 */
    (function () {
      try {
        var params = new URLSearchParams(location.search);
        var forced = params.get("theme");
        var stored = localStorage.getItem("myworld.theme");
        var theme = forced === "light" || forced === "dark"
          ? forced
          : stored || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        document.documentElement.dataset.theme = theme;
      } catch (err) {
        document.documentElement.dataset.theme = "dark";
      }
    })();
  </script>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">◆</span>
      <span class="brand-name">MyWorld</span>
      <span class="tag" id="version">v—</span>
    </div>
    <div class="topbar-right">
      <div class="pill" id="connPill" data-state="off">
        <span class="dot"></span><span id="pillText">未连接</span>
      </div>
      <div class="chip"><span class="chip-label">端口</span><span id="port">—</span></div>
      <div class="chip"><span class="chip-label">延迟</span><span id="latency">—</span></div>
      <button class="btn ghost" id="btnPing">Ping</button>
      <button class="btn" id="btnTick">模拟服务端推送</button>
      <button class="btn ghost icon" id="btnTheme" title="切换明暗主题" aria-label="切换明暗主题">
        <svg class="icon-sun" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
          <circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.6" />
          <path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4L17 7M7 17l-1.6 1.6"
                stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
          <path d="M20 14.4A8.2 8.2 0 0 1 9.6 4 8.4 8.4 0 1 0 20 14.4z"
                fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
        </svg>
      </button>
    </div>
  </header>

  <main class="layout">
    <!-- 最左侧竖向功能区：一个图标就是一栏内容 -->
    <nav class="rail" aria-label="功能区">
      <button class="rail-item is-active" data-pane="info" title="非发行版信息" aria-label="非发行版信息" aria-pressed="true">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="8.6" fill="none" stroke="currentColor" stroke-width="1.6" />
          <path d="M12 10.9v5.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
          <circle cx="12" cy="8.2" r="0.95" fill="currentColor" />
        </svg>
      </button>
      <button class="rail-item" data-pane="world" title="世界" aria-label="世界" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="8.6" fill="none" stroke="currentColor" stroke-width="1.6" />
          <ellipse cx="12" cy="12" rx="3.9" ry="8.6" fill="none" stroke="currentColor" stroke-width="1.6" />
          <path d="M3.6 12h16.8" stroke="currentColor" stroke-width="1.6" />
        </svg>
      </button>
      <button class="rail-item" data-pane="about" title="关于" aria-label="关于" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="8.6" fill="none" stroke="currentColor" stroke-width="1.6" />
          <path d="M9.6 9.4a2.5 2.5 0 1 1 3.7 2.3c-.9.5-1.3 1-1.3 1.9v.4"
                fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          <circle cx="12" cy="17.1" r="0.95" fill="currentColor" />
        </svg>
      </button>
      <button class="rail-item" data-pane="canvas" title="节点画布（即将推出）" aria-label="节点画布（即将推出）" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3.8" y="3.8" width="7" height="7" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.6" />
          <rect x="13.2" y="3.8" width="7" height="7" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.6" />
          <rect x="3.8" y="13.2" width="7" height="7" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.6" />
          <rect x="13.2" y="13.2" width="7" height="7" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.6" />
        </svg>
      </button>
    </nav>

    <!-- 功能区对应的内容面板 -->
    <aside class="panel">
      <section class="pane" data-pane="info">
        <h2>非发行版信息</h2>
        <dl class="meta" id="meta"></dl>
        <p class="hint">
          本次运行的实际状态，与发布版本无关：换台机器、换个端口、重新启动，这里都会变。
        </p>
      </section>

      <section class="pane" data-pane="world" hidden>
        <h2>世界</h2>
      </section>

      <section class="pane" data-pane="about" hidden>
        <h2>关于这一版</h2>
        <p class="hint">
          这是骨架：静态前端 + 本地 FastAPI 服务 + WebSocket 双向通道。
        </p>
        <p class="hint">
          <b>Ping</b> 是心跳，用来探活并测出延迟；<b>模拟服务端推送</b> 用来验证
          「后端 → 页面」这条单向推送通道 —— 之后执行进度、队列变化都从这里推过来。
        </p>
        <p class="hint">
          运行日志打在启动它的控制台窗口里（双击 MyWorld.exe 弹出的那个），
          网页只负责界面。
        </p>
      </section>
    </aside>

    <section class="canvas-wrap">
      <div class="canvas-grid"></div>
      <div class="canvas-hint">
        <strong>节点画布</strong>
        <span>下一步：在这块区域接入可拖拽、可连线的图编辑器</span>
      </div>
      <div class="canvas-badge" id="uptime">运行 00:00:00</div>
    </section>
  </main>

  <script src="/js/app.js"></script>
</body>
</html>
